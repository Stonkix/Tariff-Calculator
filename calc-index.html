<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Помощник подбора тарифов 1С-Отчетность</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="calc-style.css">
</head>
<body>

    <!-- Данные для графики -->
    <div id="calc-assets" style="display: none;"
        data-header-src="pdf-header.jpg"
        data-footer-src-1="pdf-footer-1.jpg"
        data-footer-src-2="pdf-footer-2.jpg"
        data-footer-src-3="pdf-footer-3.jpg"
        data-footer-src-4="pdf-footer-4.jpg"
        data-footer-src-5="pdf-footer-5.jpg"
        data-footer-src-6="pdf-footer-6.jpg">
    </div>

    <div class="calc-page-title">
        <h1>Помощник подбора тарифов 1С-Отчетность</h1>
        <p style="text-align: center; color: #666; margin-top: 10px; font-weight: 500;">Рассчитайте стоимость подключения за несколько кликов</p>
    </div>

    <div class="calc-calculator">
        <div class="calc-form-row">
            <label>Подключить группу компаний?</label>
            <div class="calc-toggle-group" id="calc-group-main-toggle">
                <button type="button" class="calc-toggle-btn calc-selected" data-value="no">Нет</button>
                <button type="button" class="calc-toggle-btn" data-value="yes">Да</button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

        <div id="calc-mode-selection-container" style="display: none;" class="calc-form-row">
            <label>Выберите режим расчета</label>
            <div class="calc-toggle-group">
                <button type="button" class="calc-tab-btn calc-toggle-btn calc-selected" data-mode="fast">Быстрый</button>
                <button type="button" class="calc-tab-btn calc-toggle-btn" data-mode="detailed">Подробный</button>
                <button type="button" class="calc-tab-btn calc-toggle-btn" data-mode="addon">Добавить в ГК</button>
            </div>
        </div>

        <div id="calc-dynamic-fields"></div>

        <div id="calc-global-addons-container" class="calc-addons-grid"></div>

        <div class="calc-details-area" style="margin-top: 25px; padding: 15px; background: #fcfcfc; border-radius: 12px; border-left: 4px solid #FF5D5B;">
            <div style="font-weight: 700; font-size: 11px; margin-bottom: 5px; color: #999; text-transform: uppercase; letter-spacing: 0.5px;">Детализация:</div>
            <div id="calc-details-content" style="font-size: 14px; white-space: pre-line; color: #444; line-height: 1.6;">Введите данные для расчета...</div>
        </div>

        <div class="calc-manual-discount-row">
            <label style="font-weight: 600; font-size: 14px;">Дополнительная скидка:</label>
            <div class="calc-inputs-group">
                <select id="calc-manual-disc-type" style="width: 135px; flex-shrink: 0;">
                    <option value="percent">Процент %</option>
                    <option value="rub">Рубли ₽</option>
                </select>
                <input type="number" 
                    id="calc-manual-disc-val" 
                    placeholder="0" 
                    min="0" 
                    style="text-align: center; min-width: 0;"
                    onkeydown="if(['-', 'e', 'E', ',', '.'].includes(event.key)) event.preventDefault();">
            </div>
        </div>

        <div class="calc-result-box" style="margin-top: 25px; padding: 25px; background: #fff8f8; border-radius: 20px; text-align: center; border: 1px solid rgba(255, 93, 91, 0.1);">
            <div style="font-weight: 600; color: #666; margin-bottom: 5px; font-size: 14px;">Итоговая стоимость:</div>
            <div id="calc-total-price" style="font-size: 36px; font-weight: 800; color: #FF5D5B; margin-bottom: 15px;">0 ₽</div>
            <div id="calc-discount-info" style="color: #27ae60; font-weight: 700; margin-bottom: 15px; display: none;"></div>

            <div id="calc-partner-contacts" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="calc-partner-name" placeholder="Ваше ФИО" style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Montserrat', sans-serif; font-size: 13px;">
                <input type="text" id="calc-client-name" placeholder="Название компании клиента" style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Montserrat', sans-serif; font-size: 13px;">
                <input type="text" id="calc-partner-phone" placeholder="Телефон партнера" style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Montserrat', sans-serif; font-size: 13px;">
                <input type="text" id="calc-partner-email" placeholder="Email партнера" style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Montserrat', sans-serif; font-size: 13px;">
            </div>

            <button id="calc-generate-pdf" class="calc-submit-btn" style="width: 100%; background-color: #FF5D5B; color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 700;">
                Скачать коммерческое предложение
            </button>
        </div>
    </div>

    <div id="calc-pdf-container-wrapper" style="display: none;">
        <div id="calc-pdf-template" style="width: 794px; background: white; font-family: 'Montserrat', sans-serif;">
            
            <div id="calc-page-1" style="width: 794px; min-height: 1120px; position: relative; background: white;">
                <img id="calc-pdf-header-img" src="" style="width: 100%; display: block;">
                <div style="padding: 0 50px; margin-top: -30px; position: relative;">
                    <h2 style="color: #FF5D5B; font-size: 18px; margin-bottom: 10px; font-weight: 800;">Стоимость подключения:</h2>
                    <table style="width: 100%; border-collapse: collapse;">
                        <tbody id="calc-pdf-rows"></tbody>
                    </table>
                    <div id="calc-res-place-p1" style="margin-top: 15px;"></div>
                </div>
            </div>

            <div id="calc-page-2" style="width: 794px; min-height: 1120px; padding: 40px 50px; background: white; box-sizing: border-box; display: none;">
                <table style="width: 100%; border-collapse: collapse;">
                    <tbody id="calc-pdf-rows-p2"></tbody>
                </table>
                <div id="calc-res-place-p2" style="margin-top: 15px;"></div>
            </div>

            <div id="calc-page-last" style="width: 794px; height: 1120px; background: white;">
                <img id="calc-pdf-footer-img" src="" style="width: 100%; display: block;">
            </div>
        </div>
    </div>

    <div style="display: none;">
        <div id="calc-summary-block" style="background: #ffdbdb; padding: 15px 20px; border-radius: 12px; text-align: center; width: 100%; box-sizing: border-box;">
            <span id="calc-pdf-client-title" style="font-size: 13px; color: #333; display: block; margin-bottom: 5px;"></span>
            <div class="calc-pdf-total-val" style="font-size: 24px; font-weight: 800; color: #FF5D5B;"></div>
            <p class="calc-pdf-discount-val" style="color: #27ae60; font-weight: 700; margin-top: 3px; font-size: 11px;"></p>
        </div>

        <div id="calc-contact-box-template" style="margin-top: 10px; padding: 15px 25px; border: 1px solid #e0e0e0; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; width: 100%;">
            <div style="flex: 1; text-align: left;">
                <div style="color: #FF5D5B; font-weight: 800; font-size: 16px; margin-bottom: 2px;">Как подключиться</div>
                <div style="color: #666; font-size: 11px;">Свяжитесь с нами, чтобы подключить сервис</div>
            </div>
            
            <div style="text-align: right; flex: 1; display: flex; flex-direction: column; gap: 2px;">
                <div id="calc-pdf-employee-name" style="font-weight: 600; color: #666; font-size: 13px; margin-bottom: 1px;"></div>
                <div class="calc-c-phone" style="font-weight: 600; font-size: 13px; color: #666;"></div>
                <div class="calc-c-email" style="font-size: 12px; color: #666; font-weight: 600;"></div>
            </div>
        </div>
    </div>

<template id="calc-tpl-solo-mode">
    <div class="calc-form-row"><label>Регион</label><select id="calc-s-reg"></select></div>
    <div class="calc-grid-adaptive" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div><label>Тип</label><div class="calc-toggle-group" id="calc-solo-ownership">
            <button class="calc-toggle-btn" data-val="ul">ЮЛ</button>
            <button class="calc-toggle-btn" data-val="ip">ИП</button>
        </div></div>
        <div><label>Срок</label><div class="calc-toggle-group" id="calc-solo-duration">
            <button class="calc-toggle-btn" data-val="1">1 год</button>
            <button class="calc-toggle-btn" data-val="2">2 года</button>
        </div></div>
    </div>
    <div class="calc-grid-adaptive" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
        <div>
            <div style="font-size: 10px; color: #999; margin-bottom: 4px; font-weight: 700; display: flex; align-items: center; gap: 5px;">
                ЛИЧНЫЙ КАБИНЕТ
                <button class="calc-months-hint-btn" onclick="CalcApp.openMonthsCalc('solo','lk')" title="Рассчитать количество месяцев">+</button>
            </div>
            <div class="calc-toggle-group" id="calc-solo-lk-group">
                <button class="calc-toggle-btn" data-val="base">Базовый</button>
                <button class="calc-toggle-btn" data-val="prof">Проф</button>
            </div>
        </div>
        <div>
            <div style="font-size: 10px; color: #999; margin-bottom: 4px; font-weight: 700; display: flex; align-items: center; gap: 5px;">
                МНОГОПОЛЬЗ. РЕЖИМ
                <button class="calc-months-hint-btn" onclick="CalcApp.openMonthsCalc('solo','multi')" title="Рассчитать количество месяцев">+</button>
            </div>
            <div class="calc-toggle-group" id="calc-solo-multi-group">
                <button class="calc-toggle-btn" data-val="small">2-9</button>
                <button class="calc-toggle-btn" data-val="large">10+</button>
            </div>
        </div>
    </div>
</template>

<template id="calc-tpl-fast-mode">
    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 40px; gap: 10px; margin-bottom: 5px; opacity: 0.6; font-size: 11px; font-weight: 700;">
        <div>РЕГИОН</div><div style="text-align:center">ЮЛ</div><div style="text-align:center">ИП</div><div></div>
    </div>
    <div id="calc-f-rows"></div>
    <button class="calc-submit-btn" style="background:#FF5D5B; margin-top:10px;" onclick="CalcApp.addFastRow()">+ Добавить регион</button>
</template>

<template id="calc-tpl-detailed-mode">
    <div id="calc-existing-count-row" class="calc-form-row" style="display: none; align-items: center; justify-content: space-between; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee;">
        <label>Уже подключено компаний в ГК</label>
        <input type="number" id="calc-existing-input" min="0" style="width: 100px; text-align: center;">
    </div>
    <div id="calc-det-cards"></div>
    <button class="calc-submit-btn" style="background: #FF5D5B;" onclick="CalcApp.addDetailedCompany()">+ Добавить компанию</button>
</template>

<template id="calc-tpl-company-card">
    <div class="calc-company-card" style="background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
        
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="text" class="calc-comp-name-input" placeholder="Название компании">
            <input type="text" class="calc-comp-inn-input" placeholder="ИНН">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <select class="calc-comp-region-select"></select>
            <div class="calc-toggle-group calc-ownership-group">
                <button class="calc-toggle-btn" data-val="ul">ЮЛ</button>
                <button class="calc-toggle-btn" data-val="ip">ИП</button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <div style="font-size: 10px; color: #999; margin-bottom: 4px; font-weight: 700; display: flex; align-items: center; gap: 5px;">
                    ЛИЧНЫЙ КАБИНЕТ
                    <button class="calc-months-hint-btn calc-months-hint-card-lk" title="Рассчитать количество месяцев">+</button>
                </div>
                <div class="calc-toggle-group calc-lk-group">
                    <button class="calc-toggle-btn" data-val="base">Базовый</button>
                    <button class="calc-toggle-btn" data-val="prof">Проф</button>
                </div>
            </div>
            <div>
                <div style="font-size: 10px; color: #999; margin-bottom: 4px; font-weight: 700; display: flex; align-items: center; gap: 5px;">
                    МНОГОПОЛЬЗ. РЕЖИМ
                    <button class="calc-months-hint-btn calc-months-hint-card-multi" title="Рассчитать количество месяцев">+</button>
                </div>
                <div class="calc-toggle-group calc-multi-group">
                    <button class="calc-toggle-btn" data-val="small">2-9</button>
                    <button class="calc-toggle-btn" data-val="large">10+</button>
                </div>
            </div>
        </div>
        
        <button class="calc-remove-card-btn" style="position:absolute; top: -10px; right: -10px; background: #fff; border: 1px solid #eee; border-radius: 50%; width: 24px; height: 24px; color: red; cursor: pointer; display: none;">&times;</button>
    </div>
</template>

    <!-- Модальное окно расчёта месяцев -->
    <div id="calc-months-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:20px; padding:28px 28px 24px; max-width:440px; width:92%; box-shadow:0 20px 60px rgba(0,0,0,0.2); font-family:'Montserrat',sans-serif; position:relative; max-height:90vh; overflow-y:auto;">
            <button onclick="CalcApp.closeMonthsCalc()" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;line-height:1;">×</button>
            <div style="font-weight:800;font-size:16px;color:#FF5D5B;margin-bottom:4px;">Расчёт стоимости расширения</div>
            <div id="calc-mc-subtitle" style="font-size:12px;color:#999;margin-bottom:18px;font-weight:600;"></div>

            <!-- Выбор варианта -->
            <div id="calc-mc-variant-row" style="margin-bottom:16px;">
                <label style="display:block;font-weight:600;font-size:12px;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Вариант</label>
                <div id="calc-mc-variant-group" style="display:flex;background:#f1f3f5;padding:5px;border-radius:14px;gap:5px;"></div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
                <div>
                    <label style="display:block;font-weight:600;font-size:13px;margin-bottom:6px;">Дата начала расширения</label>
                    <input type="text" id="calc-mc-connect-date" placeholder="дд.мм.гггг"
                        style="width:100%;padding:10px 12px;border:1px solid #e1e8ed;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:13px;box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block;font-weight:600;font-size:13px;margin-bottom:6px;">Дата окончания расширения</label>
                    <input type="text" id="calc-mc-license-end" placeholder="дд.мм.гггг"
                        style="width:100%;padding:10px 12px;border:1px solid #e1e8ed;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:13px;box-sizing:border-box;">
                </div>
            <button onclick="CalcApp.calcMonths()" style="width:100%;padding:12px;background:#FF5D5B;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:'Montserrat',sans-serif;margin-bottom:14px;">Рассчитать</button>

            <div id="calc-mc-result" style="display:none;background:#fff8f8;border-radius:12px;padding:14px 18px;margin-bottom:14px;border:1px solid rgba(255,93,91,0.15);">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                    <div>
                        <div style="font-size:11px;color:#999;margin-bottom:2px;">Месяцев</div>
                        <div id="calc-mc-months-val" style="font-size:26px;font-weight:800;color:#FF5D5B;"></div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:11px;color:#999;margin-bottom:2px;">Стоимость</div>
                        <div id="calc-mc-price-val" style="font-size:26px;font-weight:800;color:#333;"></div>
                        <div id="calc-mc-price-formula" style="font-size:10px;color:#bbb;margin-top:2px;"></div>
                    </div>
                </div>
                <div id="calc-mc-explain" style="font-size:11px;color:#999;margin-top:8px;border-top:1px solid #f0e0e0;padding-top:8px;"></div>
            </div>

            <button id="calc-mc-apply-btn" onclick="CalcApp.applyMonths()" style="width:100%;padding:12px;background:#27ae60;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:'Montserrat',sans-serif;display:none;margin-bottom:10px;">Применить к расчёту</button>
            <button onclick="CalcApp.closeMonthsCalc()" style="width:100%;padding:10px;background:none;border:1px solid #eee;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;color:#999;font-family:'Montserrat',sans-serif;">← Назад</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="calc-script.js"></script>
</body>
</html>
